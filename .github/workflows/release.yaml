name: Release

on:
  push:
    tags:
      - "*"
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/smirl/digitalocean-floating-ip-controller

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    environment:
      name: prod
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: azure/setup-kubectl@v5
        with:
          version: 'latest'

      - uses: imranismail/setup-kustomize@v3

      - uses: azure/k8s-set-context@v5
        with:
          method: service-account
          k8s-url: ${{ secrets.K8S_URL }}
          k8s-secret: ${{ secrets.K8S_SECRET }}

      - name: Deploy
        run: IMG=ghcr.io/smirl/digitalocean-floating-ip-controller:${{ github.ref_name }} make deploy
